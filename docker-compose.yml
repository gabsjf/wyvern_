services:
  db:
    image: postgres:15
    container_name: wyvern_db
    environment:
      - POSTGRES_USER=wyvern
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      - POSTGRES_DB=wyverndb
    # Sem "ports": o banco só é acessível pela rede interna do compose.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wyvern -d wyverndb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wyvern_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Database=wyverndb;Username=wyvern;Password=${POSTGRES_PASSWORD};
      - Jwt__Key=${JWT_KEY:?Defina JWT_KEY (mínimo 32 caracteres) no arquivo .env}
      - Jwt__Issuer=WyvernApi
      - Jwt__Audience=WyvernFront
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:?Defina FRONTEND_ORIGIN no arquivo .env}
      # E-mail (confirmação de cadastro). Brevo: smtp-relay.brevo.com, porta 587.
      - Email__UrlFront=${FRONTEND_ORIGIN}
      - Email__Host=${EMAIL_HOST:?Defina EMAIL_HOST no arquivo .env}
      - Email__Porta=${EMAIL_PORTA:-587}
      - Email__Usuario=${EMAIL_USUARIO:?Defina EMAIL_USUARIO no arquivo .env}
      - Email__Senha=${EMAIL_SENHA:?Defina EMAIL_SENHA no arquivo .env}
      - Email__Remetente=${EMAIL_REMETENTE:?Defina EMAIL_REMETENTE no arquivo .env}
    # Sem "ports": quem fala com a API é o Caddy, pela rede interna.
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: wyvern_caddy
    # O DNS herdado do host (127.0.0.53) não funciona dentro do contêiner nesta VPS.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - DOMAIN=${DOMAIN:?Defina DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./front:/srv/front:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
